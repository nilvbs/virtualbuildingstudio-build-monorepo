# Local / Docker Desktop — Postgres + API together.
# Credentials come from `.env` (see `.env.example`). Do not commit real secrets.
#
#   docker compose up -d --build
#   curl http://localhost:4000/health

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bld-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surveylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surveylink}
      POSTGRES_DB: ${POSTGRES_DB:-surveylink}
    ports:
      - "5435:5432"
    volumes:
      - bld_pgdata:/var/lib/postgresql/data
      - ./deploy/ec2/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-surveylink}\" -d \"$${POSTGRES_DB:-surveylink}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bld-migrate
    restart: "no"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "pnpm",
        "--filter",
        "@surveylink/api",
        "exec",
        "prisma",
        "migrate",
        "deploy",
      ]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: bld-api:local
    container_name: bld-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-bld-build}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  bld_pgdata:
    name: bld_pgdata
