services:
  db:
    image: postgis/postgis:16-3.4
    container_name: surveylink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: surveylink
      POSTGRES_PASSWORD: surveylink
      POSTGRES_DB: surveylink
    ports:
      - "5432:5432"
    volumes:
      - surveylink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveylink -d surveylink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  surveylink_pgdata:
