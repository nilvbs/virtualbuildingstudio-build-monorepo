# Shared proxy locations for staging.bld.online (HTTP and HTTPS server blocks).
# Deploy copies this to /etc/nginx/snippets/bld-staging-proxy.conf and reloads Nginx.
# Do NOT put listen/ssl here — Certbot owns TLS on the site file.
#
# $cf_worker + resolver: DNS is resolved per request. A workers.dev lookup
# failure must not prevent `nginx -t` / startup (that outage lasted 12 days).

resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;
# Canonical Workers hostname for wrangler name `bld-web-staging` (stable across deploys).
# Do NOT pin OpenNext preview hosts like `fd933ab4-bld-web-staging.…` — those go stale.
set $cf_worker bld-web-staging.sweet-waterfall-ebfe.workers.dev;

location /api/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}

location = /api {
    return 301 /api/;
}

location / {
    proxy_pass https://$cf_worker;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $cf_worker;
    proxy_set_header Host $cf_worker;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
