# http-context rate-limit zones for staging.bld.online.
# Deploy copies this to /etc/nginx/conf.d/ (included inside `http {}` on Ubuntu).
# Used by nginx-snippets/bld-staging-proxy.conf. Keys on the direct client IP
# (DNS points straight at EC2; no CDN in front).

limit_req_zone $binary_remote_addr zone=bld_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=bld_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=bld_conn:10m;
limit_req_status 429;
limit_conn_status 429;
