# staging.bld.online — web + API on ONE hostname
#
#   https://staging.bld.online/        → Cloudflare Worker (OpenNext)
#   https://staging.bld.online/api/*   → Nest :4000
#
# DNS stays: A staging → EC2 Elastic IP (do NOT orange-cloud this hostname
# in Cloudflare DNS, and do NOT add staging.bld.online as a Worker custom
# domain — Nginx is the public TLS terminator).
#
# Install / refresh on EC2:
#   sudo cp nginx-staging.conf /etc/nginx/sites-available/staging.bld.online
#   sudo ln -sf /etc/nginx/sites-available/staging.bld.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.bld.online   # adds listen 443 + certs
#
# If you already have a certbot-managed 443 server block, copy the `location`
# blocks below into THAT file instead of overwriting it (overwriting drops TLS
# and makes browsers show connection-reset).

server {
    listen 80;
    listen [::]:80;
    server_name staging.bld.online;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /api {
        return 301 /api/;
    }

    # Web — same Worker that already works at *.workers.dev
    location / {
        proxy_pass https://fd933ab4-bld-web-staging.sweet-waterfall-ebfe.workers.dev;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name fd933ab4-bld-web-staging.sweet-waterfall-ebfe.workers.dev;
        proxy_set_header Host fd933ab4-bld-web-staging.sweet-waterfall-ebfe.workers.dev;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
