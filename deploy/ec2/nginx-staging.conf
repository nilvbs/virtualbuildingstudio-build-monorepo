# staging.bld.online — web + API on ONE hostname
#
#   https://staging.bld.online/        → Cloudflare Worker (OpenNext)
#   https://staging.bld.online/api/*   → Nest :4000
#
# 1. Deploy web: pnpm deploy:web  → note the *.workers.dev URL
# 2. Replace EVERY occurrence of CF_WORKER_HOST below
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. sudo certbot --nginx -d staging.bld.online   (if not done yet)
#
# DNS stays: A staging → EC2 Elastic IP

server {
    listen 80;
    listen [::]:80;
    server_name staging.bld.online;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /api {
        return 301 /api/;
    }

    # Web — Cloudflare Workers (edit CF_WORKER_HOST)
    location / {
        proxy_pass https://CF_WORKER_HOST;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name CF_WORKER_HOST;
        proxy_set_header Host CF_WORKER_HOST;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
