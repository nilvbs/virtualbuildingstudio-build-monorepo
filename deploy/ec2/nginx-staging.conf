# staging.bld.online — HTTP vhost (Certbot adds the 443 server).
#
#   /        → Cloudflare Worker (OpenNext)
#   /api/*   → Nest :4000
#
# DNS: A staging → EC2. Do not orange-cloud this name; Nginx terminates TLS.
#
# Proxy locations live in snippets/bld-staging-proxy.conf so deploys can update
# the Worker host without overwriting Let's Encrypt listen/ssl lines.
#
# Fresh box:
#   sudo cp nginx-snippets/bld-staging-proxy.conf /etc/nginx/snippets/
#   sudo cp nginx-staging.conf /etc/nginx/sites-available/staging.bld.online
#   sudo ln -sf /etc/nginx/sites-available/staging.bld.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl enable --now nginx
#   sudo certbot --nginx -d staging.bld.online
# After Certbot, add the same include to the new 443 server block (once).

server {
    listen 80;
    listen [::]:80;
    server_name staging.bld.online;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include /etc/nginx/snippets/bld-staging-proxy.conf;
}
