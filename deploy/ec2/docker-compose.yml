# EC2 staging — API uses Aurora ONLY (Secrets Manager / Phase 1).
# No local Postgres service. No bld_pgdata volume. No DB passwords in this file.
#
#   cd ~/BLD/stage
#   docker compose up -d redis api
#   curl http://127.0.0.1:4000/health

services:
  api:
    image: bld-api:local
    container_name: bld-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Shared rate-limit store. Private compose network only (no host port);
  # REDIS_PASSWORD is generated on the box by deploy-api.yml. Swap REDIS_URL to
  # ElastiCache later without code changes.
  redis:
    image: redis:7-alpine
    container_name: bld-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy volatile-ttl --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
