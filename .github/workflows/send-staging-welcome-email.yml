name: Send Staging Welcome Email

# Sends the branded BLD welcome template (apps/api welcome-email builder)
# using staging SendGrid secrets.

on:
  workflow_dispatch:
    inputs:
      to_email:
        description: Recipient email
        required: true
        type: string
      full_name:
        description: Recipient display name
        required: false
        default: Neeyal
        type: string
      role:
        description: client or surveyor
        required: false
        default: client
        type: choice
        options:
          - client
          - surveyor

jobs:
  send:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @surveylink/types build
      - run: pnpm --filter @surveylink/validation build
      - run: pnpm --filter @surveylink/api run prisma:generate
      - run: pnpm --filter @surveylink/api build

      - name: Send branded welcome email
        env:
          TO_EMAIL: ${{ inputs.to_email }}
          FULL_NAME: ${{ inputs.full_name }}
          ROLE: ${{ inputs.role }}
          WEB_APP_URL: https://staging.bld.online
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TWILIO_EMAIL_FROM: ${{ secrets.TWILIO_EMAIL_FROM }}
          TWILIO_EMAIL_FROM_NAME: ${{ secrets.TWILIO_EMAIL_FROM_NAME }}
        run: node scripts/send-welcome-email.mjs
