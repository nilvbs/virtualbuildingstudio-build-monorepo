name: Peek Staging Admin Account

on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BLD/stage
            echo '=== .env super admin keys (password masked) ==='
            grep -E '^SUPER_ADMIN_' .env | tr -d '\r' | sed -E 's/(PASSWORD=).*/\1***/'
            echo '=== docker api env ==='
            docker compose exec -T api printenv 2>/dev/null | grep -E '^SUPER_ADMIN_' | sed -E 's/(PASSWORD=).*/\1***/' || echo 'api env unavailable'
            echo '=== admin users in db ==='
            docker exec bld-db psql -U surveylink -d surveylink -c "SELECT u.email, u.status, ap.staff_level FROM users u JOIN admin_profiles ap ON ap.user_id = u.id ORDER BY ap.staff_level, u.email;" || echo 'db query failed'
