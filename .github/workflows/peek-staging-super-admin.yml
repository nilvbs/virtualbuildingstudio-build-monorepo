name: Peek Staging Super Admin Email
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BLD/stage
            # Email only — never print password into CI logs
            grep -E '^SUPER_ADMIN_EMAIL=' .env | tr -d '\r' || true
            if grep -qE '^SUPER_ADMIN_PASSWORD=.+' .env; then echo 'SUPER_ADMIN_PASSWORD=SET'; else echo 'SUPER_ADMIN_PASSWORD=UNSET'; fi
