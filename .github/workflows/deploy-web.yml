name: Deploy Web

# Push to main (web/packages changes) → Cloudflare Workers (OpenNext)
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Vars:    NEXT_PUBLIC_API_URL (e.g. https://staging.bld.online/api)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/* export dist/ — build them before Next/OpenNext resolves @surveylink/*
      - name: Build workspace packages for web
        run: pnpm exec turbo run build --filter=@surveylink/web^...

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN (required for wrangler deploy)."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add both under: Settings → Environments → staging → Environment secrets"
            echo "(this job uses environment: staging). Token needs Workers Scripts Edit + Account Read."
            echo "Create token: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/"
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_AUTH_DEV_MODE: 'false'
        run: pnpm run deploy

      - name: Smoke staging.bld.online
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/web.html -w '%{http_code}' --max-time 20 https://staging.bld.online/)
          echo "web HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::https://staging.bld.online/ returned $code after Worker deploy. Nginx may be down or still pointing at an old workers.dev host."
            exit 1
          fi
          curl -sS --max-time 20 https://staging.bld.online/api/health | grep -q '"status":"ok"'
          echo "staging.bld.online web + API ok"
