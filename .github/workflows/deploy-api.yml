name: Deploy API

# main  → staging EC2 (GHCR image + SSH compose)
# tag v* → production ECS (existing AWS path)
#
# Staging secrets: EC2_HOST, EC2_SSH_KEY ; var EC2_USER (ubuntu)
# Production env:  AWS_DEPLOY_ROLE_ARN, DATABASE_URL, DIRECT_DATABASE_URL
#                  vars AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE, ECS_CONTAINER_NAME

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'apps/api/Dockerfile'
      - 'deploy/ec2/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - id: pick
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi

  staging-ec2:
    needs: setup
    if: needs.setup.outputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository }}/bld-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/${{ github.repository }}/bld-api:staging" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        run: |
          docker build -f apps/api/Dockerfile -t "${{ steps.meta.outputs.image }}" -t "${{ steps.meta.outputs.image_latest }}" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.image_latest }}"

      - name: Resolve EC2 app dir
        id: dirs
        run: |
          APP_DIR="${{ vars.EC2_APP_DIR }}"
          USERNAME="${{ vars.EC2_USER }}"
          echo "app_dir=${APP_DIR:-/home/ubuntu/BLD/stage}" >> "$GITHUB_OUTPUT"
          echo "user=${USERNAME:-ubuntu}" >> "$GITHUB_OUTPUT"

      - name: Sync compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ steps.dirs.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/ec2/docker-compose.yml,deploy/ec2/postgres-init/*,deploy/ec2/nginx-snippets/*
          target: ${{ steps.dirs.outputs.app_dir }}/
          strip_components: 2
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ steps.dirs.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="${{ steps.dirs.outputs.app_dir }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${{ steps.meta.outputs.image }}"
            docker tag "${{ steps.meta.outputs.image }}" bld-api:local
            cd "$APP_DIR"
            mkdir -p postgres-init
            if ! grep -q '^\s*db:' docker-compose.yml; then
              echo "::error::docker-compose.yml on EC2 has no db service — compose sync failed"
              exit 1
            fi
            # PostGIS DB + migrate on the compose network (@db), then API.
            docker compose up -d db
            echo "Waiting for PostGIS..."
            db_timeout=90
            db_elapsed=0
            while [ "$(docker inspect -f '{{.State.Health.Status}}' bld-db 2>/dev/null || echo starting)" != "healthy" ]; do
              if [ "$db_elapsed" -ge "$db_timeout" ]; then
                echo "PostGIS container never became healthy"
                docker logs bld-db --tail=80 || true
                exit 1
              fi
              sleep 2
              db_elapsed=$((db_elapsed + 2))
              echo "Waiting for db... (${db_elapsed}/${db_timeout}s)"
            done
            if ! docker compose run --rm migrate; then
              echo "::error::prisma migrate deploy failed."
              echo "Need PostGIS compose + DATABASE_URL host db:5432 (compose overrides this)."
              echo "If P3018 on a failed init migration after fixing PostGIS:"
              echo "  docker compose run --rm migrate sh -c 'cd /app/apps/api && npx prisma migrate resolve --rolled-back 20260711000000_init && npx prisma migrate deploy'"
              exit 1
            fi
            docker compose up -d --force-recreate api
            echo "Waiting for Docker health..."
            timeout=90
            elapsed=0
            while [ "$(docker inspect -f '{{.State.Health.Status}}' bld-api)" != "healthy" ]; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "Container never became healthy"
                docker logs bld-api --tail=100
                exit 1
              fi
              sleep 2
              elapsed=$((elapsed + 2))
              echo "Waiting... (${elapsed}/${timeout}s)"
            done
            echo "Container is healthy!"
            # Proxy snippet only — never overwrite the Certbot 443 site file.
            sudo mkdir -p /etc/nginx/snippets
            if [ -f "$APP_DIR/nginx-snippets/bld-staging-proxy.conf" ]; then
              sudo cp "$APP_DIR/nginx-snippets/bld-staging-proxy.conf" /etc/nginx/snippets/bld-staging-proxy.conf
            elif [ -f "$APP_DIR/bld-staging-proxy.conf" ]; then
              sudo cp "$APP_DIR/bld-staging-proxy.conf" /etc/nginx/snippets/bld-staging-proxy.conf
            else
              echo "WARN: nginx snippet not synced; skip Nginx reload"
            fi
            if [ -f /etc/nginx/snippets/bld-staging-proxy.conf ]; then
              sudo nginx -t
              sudo systemctl enable nginx
              sudo systemctl start nginx
              sudo systemctl reload nginx
              sudo systemctl enable --now certbot.timer || true
            fi
            echo "Public smoke:"
            curl -sSI --max-time 15 https://staging.bld.online/ | head -n 12
            curl -sS --max-time 15 https://staging.bld.online/api/health
            echo

  production-ecs:
    needs: setup
    if: needs.setup.outputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm --filter @surveylink/api exec prisma migrate deploy

      - name: Render new task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/aws/task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
