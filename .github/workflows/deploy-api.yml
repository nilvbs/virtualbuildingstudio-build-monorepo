name: Deploy API

# main  → staging EC2 (GHCR image + SSH compose)
# tag v* → production ECS (existing AWS path)
#
# Staging secrets: EC2_HOST, EC2_SSH_KEY ; var EC2_USER (ubuntu)
# Production env:  AWS_DEPLOY_ROLE_ARN, DATABASE_URL, DIRECT_DATABASE_URL
#                  vars AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE, ECS_CONTAINER_NAME

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'apps/api/Dockerfile'
      - 'deploy/ec2/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - id: pick
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi

  staging-ec2:
    needs: setup
    if: needs.setup.outputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository }}/bld-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/${{ github.repository }}/bld-api:staging" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        run: |
          docker build -f apps/api/Dockerfile -t "${{ steps.meta.outputs.image }}" -t "${{ steps.meta.outputs.image_latest }}" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.image_latest }}"

      - name: Resolve EC2 app dir
        id: dirs
        run: |
          APP_DIR="${{ vars.EC2_APP_DIR }}"
          USERNAME="${{ vars.EC2_USER }}"
          echo "app_dir=${APP_DIR:-/home/ubuntu/BLD/stage}" >> "$GITHUB_OUTPUT"
          echo "user=${USERNAME:-ubuntu}" >> "$GITHUB_OUTPUT"

      - name: Sync compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ steps.dirs.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/ec2/docker-compose.yml,deploy/ec2/postgres-init/*,deploy/ec2/nginx-snippets/*
          target: ${{ steps.dirs.outputs.app_dir }}/
          strip_components: 2
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TWILIO_EMAIL_FROM: ${{ secrets.TWILIO_EMAIL_FROM }}
          TWILIO_EMAIL_FROM_NAME: ${{ secrets.TWILIO_EMAIL_FROM_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ steps.dirs.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_FROM_NUMBER,TWILIO_VERIFY_SERVICE_SID,TWILIO_MESSAGING_SERVICE_SID,SENDGRID_API_KEY,TWILIO_EMAIL_FROM,TWILIO_EMAIL_FROM_NAME,DATABASE_URL,DIRECT_DATABASE_URL,WEB_APP_URL,CORS_ORIGINS
          script: |
            set -euo pipefail
            APP_DIR="${{ steps.dirs.outputs.app_dir }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Free disk before pull — staging hosts fill up with old GHCR layers.
            df -h / | tail -n 1 || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            df -h / | tail -n 1 || true
            docker pull "${{ steps.meta.outputs.image }}"
            docker tag "${{ steps.meta.outputs.image }}" bld-api:local
            cd "$APP_DIR"
            mkdir -p postgres-init
            if ! grep -q '^\s*api:' docker-compose.yml; then
              echo "::error::docker-compose.yml on EC2 has no api service — compose sync failed"
              exit 1
            fi

            # Upsert Twilio SMS + SendGrid email credentials into host .env (compose env_file).
            upsert_env() {
              key="$1"
              val="$2"
              file="$APP_DIR/.env"
              touch "$file"
              chmod 600 "$file" || true
              if [ -z "$val" ]; then
                echo "WARN: $key empty — leave existing value"
                return 0
              fi
              # Escape for sed replacement (& and \).
              esc=$(printf '%s' "$val" | sed -e 's/[&\\]/\\&/g')
              if grep -q "^${key}=" "$file"; then
                sed -i "s|^${key}=.*|${key}=${esc}|" "$file"
              else
                printf '\n%s=%s\n' "$key" "$val" >> "$file"
              fi
            }
            upsert_env TWILIO_ACCOUNT_SID "${TWILIO_ACCOUNT_SID:-}"
            upsert_env TWILIO_AUTH_TOKEN "${TWILIO_AUTH_TOKEN:-}"
            upsert_env TWILIO_FROM_NUMBER "${TWILIO_FROM_NUMBER:-}"
            upsert_env TWILIO_VERIFY_SERVICE_SID "${TWILIO_VERIFY_SERVICE_SID:-}"
            upsert_env TWILIO_MESSAGING_SERVICE_SID "${TWILIO_MESSAGING_SERVICE_SID:-}"
            upsert_env SENDGRID_API_KEY "${SENDGRID_API_KEY:-}"
            upsert_env TWILIO_EMAIL_FROM "${TWILIO_EMAIL_FROM:-}"
            upsert_env TWILIO_EMAIL_FROM_NAME "${TWILIO_EMAIL_FROM_NAME:-}"
            # Optional: refresh Aurora URLs from GitHub Environment secrets when set.
            upsert_env DATABASE_URL "${DATABASE_URL:-}"
            upsert_env DIRECT_DATABASE_URL "${DIRECT_DATABASE_URL:-}"
            upsert_env WEB_APP_URL "${WEB_APP_URL:-}"
            upsert_env CORS_ORIGINS "${CORS_ORIGINS:-}"
            if grep -q '^TWILIO_ACCOUNT_SID=AC' "$APP_DIR/.env"; then
              echo "Twilio SMS env present on EC2 .env"
            else
              echo "WARN: TWILIO_ACCOUNT_SID not set on EC2 .env"
            fi
            if grep -q '^TWILIO_VERIFY_SERVICE_SID=VA' "$APP_DIR/.env"; then
              echo "Twilio Verify SID present on EC2 .env"
            else
              echo "WARN: TWILIO_VERIFY_SERVICE_SID not set on EC2 .env"
            fi
            if grep -q '^TWILIO_MESSAGING_SERVICE_SID=MG' "$APP_DIR/.env"; then
              echo "Twilio Messaging Service SID present on EC2 .env"
            else
              echo "WARN: TWILIO_MESSAGING_SERVICE_SID not set on EC2 .env"
            fi
            if grep -q '^SENDGRID_API_KEY=SG\.' "$APP_DIR/.env" || grep -q '^SENDGRID_API_KEY=SG' "$APP_DIR/.env"; then
              echo "SendGrid API key present on EC2 .env"
            else
              echo "WARN: SENDGRID_API_KEY not set on EC2 .env — welcome/OTP email will not deliver"
            fi
            if grep -q '^TWILIO_EMAIL_FROM=.\+@' "$APP_DIR/.env"; then
              echo "SendGrid from-address present on EC2 .env"
            else
              echo "WARN: TWILIO_EMAIL_FROM not set on EC2 .env"
            fi
            if grep -q 'sslmode=require' "$APP_DIR/.env" && grep -q '^DATABASE_URL=postgresql://' "$APP_DIR/.env"; then
              echo "Aurora DATABASE_URL with sslmode=require present on EC2 .env"
            else
              echo "::error::DATABASE_URL must point at Aurora with sslmode=require (no hardcoded local db passwords in compose)."
              exit 1
            fi
            # Refuse local Docker Postgres hosts — staging is Aurora-only.
            if grep -E '^DATABASE_URL=.*(://[^/@]*@(db|bld-db|localhost|127\.0\.0\.1)[:/])' "$APP_DIR/.env"; then
              echo "::error::DATABASE_URL still points at local Docker/host Postgres. Staging must use Aurora only."
              exit 1
            fi
            if ! grep -E '^DATABASE_URL=.*\.rds\.amazonaws\.com' "$APP_DIR/.env"; then
              echo "::error::DATABASE_URL must target an RDS/Aurora hostname (*.rds.amazonaws.com)."
              exit 1
            fi

            # Remove legacy local DB containers/volumes so they cannot be used again.
            docker rm -f bld-db bld-db-oldcheck 2>/dev/null || true
            docker compose rm -sf db migrate 2>/dev/null || true
            if docker volume inspect bld_pgdata >/dev/null 2>&1; then
              echo "Removing legacy local Postgres volume bld_pgdata (Aurora-only staging)"
              docker volume rm -f bld_pgdata || true
            fi

            # Apply Prisma migrations against Aurora using host .env (before API recreate).
            echo "Running prisma migrate deploy against Aurora..."
            docker run --rm --env-file "$APP_DIR/.env" --entrypoint "" \
              "${{ steps.meta.outputs.image }}" \
              sh -c "cd /app/apps/api && npx prisma migrate deploy"

            # API only — database is Aurora (credentials live in host .env / Secrets Manager).
            docker compose up -d --force-recreate --remove-orphans api
            echo "Waiting for Docker health..."
            timeout=90
            elapsed=0
            while [ "$(docker inspect -f '{{.State.Health.Status}}' bld-api)" != "healthy" ]; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "Container never became healthy"
                docker logs bld-api --tail=100
                exit 1
              fi
              sleep 2
              elapsed=$((elapsed + 2))
              echo "Waiting... (${elapsed}/${timeout}s)"
            done
            echo "Container is healthy!"
            # Proxy snippet only — never overwrite the Certbot 443 site file.
            sudo mkdir -p /etc/nginx/snippets
            if [ -f "$APP_DIR/nginx-snippets/bld-staging-proxy.conf" ]; then
              sudo cp "$APP_DIR/nginx-snippets/bld-staging-proxy.conf" /etc/nginx/snippets/bld-staging-proxy.conf
            elif [ -f "$APP_DIR/bld-staging-proxy.conf" ]; then
              sudo cp "$APP_DIR/bld-staging-proxy.conf" /etc/nginx/snippets/bld-staging-proxy.conf
            else
              echo "WARN: nginx snippet not synced; skip Nginx reload"
            fi
            if [ -f /etc/nginx/snippets/bld-staging-proxy.conf ]; then
              sudo nginx -t
              sudo systemctl enable nginx
              sudo systemctl start nginx
              sudo systemctl reload nginx
              sudo systemctl enable --now certbot.timer || true
            fi
            echo "Public smoke:"
            curl -sSI --max-time 15 https://staging.bld.online/ | head -n 12
            curl -sS --max-time 15 https://staging.bld.online/api/health
            echo
            docker logs bld-api --tail=40 2>&1 | grep -E 'Twilio|SMS' || true

  production-ecs:
    needs: setup
    if: needs.setup.outputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm --filter @surveylink/api exec prisma migrate deploy

      - name: Render new task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/aws/task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
