name: Fix Staging Auth0 User

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email to mark verified in Auth0
        required: true
        default: neeyaljain6@gmail.com

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Mark Auth0 email verified
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BLD/stage
            # EC2 .env may have Windows CRLF from earlier edits.
            eval "$(grep -E '^(AUTH0_DOMAIN|AUTH0_MGMT_CLIENT_ID|AUTH0_MGMT_CLIENT_SECRET)=' .env | tr -d '\r')"
            EMAIL='${{ inputs.email }}'
            echo "Looking up $EMAIL on ${AUTH0_DOMAIN}"
            TOKEN=$(curl -sS -X POST "https://${AUTH0_DOMAIN}/oauth/token" \
              -H 'content-type: application/json' \
              -d "{\"client_id\":\"${AUTH0_MGMT_CLIENT_ID}\",\"client_secret\":\"${AUTH0_MGMT_CLIENT_SECRET}\",\"audience\":\"https://${AUTH0_DOMAIN}/api/v2/\",\"grant_type\":\"client_credentials\"}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$EMAIL")
            USERS=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://${AUTH0_DOMAIN}/api/v2/users-by-email?email=${ENC}")
            echo "$USERS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("count", len(d));
            [print(u.get("user_id"), "verified=", u.get("email_verified")) for u in d]'
            echo "$USERS" | python3 -c 'import sys,json; print("\n".join(u["user_id"] for u in json.load(sys.stdin)))' | while read -r row; do
              [ -z "$row" ] && continue
              echo "Patching $row email_verified=true"
              ENC_ID=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$row")
              curl -sS -X PATCH "https://${AUTH0_DOMAIN}/api/v2/users/${ENC_ID}" \
                -H "Authorization: Bearer $TOKEN" \
                -H 'content-type: application/json' \
                -d '{"email_verified":true}' \
                | python3 -c 'import sys,json; u=json.load(sys.stdin); print("now verified=", u.get("email_verified"))'
            done
            echo '=== DB users/roles ==='
            docker exec bld-db psql -U surveylink -d surveylink -c "SELECT u.email, u.phone, u.auth_provider, ur.role FROM users u LEFT JOIN user_roles ur ON ur.user_id = u.id WHERE u.email ILIKE '%neeyaljain%' ORDER BY u.email, ur.role;"
