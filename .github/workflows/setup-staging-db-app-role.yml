name: Staging DB app role (create / rotate)

# Least-privilege Aurora access for the staging API.
#   - bld_app: LOGIN, DML only (SELECT/INSERT/UPDATE/DELETE + sequences), no DDL,
#     no access to _prisma_migrations. The API runs as this role (DATABASE_URL).
#   - Owner (existing user): only used by `prisma migrate deploy` (DIRECT_DATABASE_URL).
# Every run generates a new bld_app password on the EC2 box = credential rotation.
# The password never leaves the box and is never printed (public Actions logs).
# If the API does not come back healthy on bld_app, .env falls back to the owner URL.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 */3 *' # quarterly rotation
  push:
    branches: [main]
    paths: ['.github/workflows/setup-staging-db-app-role.yml']

permissions:
  contents: read

concurrency:
  group: staging-db-app-role
  cancel-in-progress: false

jobs:
  role:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Resolve EC2 settings
        id: dirs
        run: |
          APP_DIR="${{ vars.EC2_APP_DIR }}"
          USERNAME="${{ vars.EC2_USER }}"
          echo "app_dir=${APP_DIR:-/home/ubuntu/BLD/stage}" >> "$GITHUB_OUTPUT"
          echo "user=${USERNAME:-ubuntu}" >> "$GITHUB_OUTPUT"

      - name: Create or rotate bld_app on Aurora
        id: remote
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ steps.dirs.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          capture_stdout: true
          command_timeout: 12m
          script: |
            set -eu
            cd "${{ steps.dirs.outputs.app_dir }}"
            ENV_FILE=.env
            PG_IMG=postgres:17-alpine

            getenv() { grep "^$1=" "$ENV_FILE" | tail -n 1 | cut -d= -f2- | tr -d '\r'; }
            setenv() {
              esc=$(printf '%s' "$2" | sed -e 's/[&\\|]/\\&/g')
              if grep -q "^$1=" "$ENV_FILE"; then
                sed -i "s|^$1=.*|$1=${esc}|" "$ENV_FILE"
              else
                printf '\n%s=%s\n' "$1" "$2" >> "$ENV_FILE"
              fi
            }
            # Prisma-only params (schema, connection_limit…) are not valid libpq URI params.
            libpq_url() { printf '%s?sslmode=require' "${1%%\?*}"; }
            psql_as() {
              docker run --rm -i -e PGURL="$(libpq_url "$1")" -e PW="${PW:-}" "$PG_IMG" \
                sh -c 'psql "$PGURL" -X -q -A -t -1 -v ON_ERROR_STOP=1 -v pw="$PW"'
            }
            fall_back_to_owner() {
              setenv DATABASE_URL "$OWNER_URL"
              sed -i '/^DB_APP_ROLE=/d' "$ENV_FILE"
              docker compose up -d --force-recreate api >/dev/null 2>&1 || true
            }
            # After a rotation the old bld_app password in .env is dead: never leave the API on it.
            abort_after_rotation() {
              if grep -q '^DB_APP_ROLE=bld_app' "$ENV_FILE"; then fall_back_to_owner; fi
              echo "RESULT_STAGE=$1"; exit 1
            }
            wait_api() {
              for i in $(seq 1 45); do
                [ "$(docker inspect -f '{{.State.Health.Status}}' bld-api 2>/dev/null)" = "healthy" ] && return 0
                sleep 2
              done
              return 1
            }

            # Owner = migrations user. After the first run DATABASE_URL is bld_app, so prefer DIRECT.
            OWNER_URL=$(getenv DIRECT_DATABASE_URL)
            [ -n "$OWNER_URL" ] || OWNER_URL=$(getenv DATABASE_URL)
            case "$OWNER_URL" in
              postgresql://bld_app:*|postgres://bld_app:*) echo "RESULT_STAGE=owner_url_is_app_role"; exit 1 ;;
              "") echo "RESULT_STAGE=no_database_url"; exit 1 ;;
            esac

            # --- 1. Can the owner create roles? ---
            PRE=$(psql_as "$OWNER_URL" <<'SQL'
            SELECT (r.rolcreaterole OR r.rolsuper)::text FROM pg_roles r WHERE r.rolname = current_user;
            SQL
            )
            echo "RESULT_OWNER_CAN_CREATE_ROLE=$PRE"
            if [ "$PRE" != "true" ]; then echo "RESULT_STAGE=owner_lacks_createrole"; exit 1; fi

            # --- 2. Create / rotate bld_app with DML-only grants ---
            PW=$(openssl rand -hex 24)
            export PW
            psql_as "$OWNER_URL" <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bld_app') THEN
                CREATE ROLE bld_app LOGIN;
              END IF;
            END $$;
            ALTER ROLE bld_app WITH LOGIN CONNECTION LIMIT 60 PASSWORD :'pw';
            DO $$ BEGIN EXECUTE format('GRANT CONNECT ON DATABASE %I TO bld_app', current_database()); END $$;
            GRANT USAGE ON SCHEMA public TO bld_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bld_app;
            GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO bld_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO bld_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO bld_app;
            DO $$
            BEGIN
              IF to_regclass('public._prisma_migrations') IS NOT NULL THEN
                REVOKE ALL ON TABLE public._prisma_migrations FROM bld_app;
              END IF;
              -- Pre-PG15 clusters let PUBLIC create in schema public; close that if we own the schema.
              IF has_schema_privilege('bld_app', 'public', 'CREATE')
                 AND (SELECT nspowner FROM pg_namespace WHERE nspname = 'public')
                     = (SELECT oid FROM pg_roles WHERE rolname = current_user) THEN
                REVOKE CREATE ON SCHEMA public FROM PUBLIC;
              END IF;
            END $$;
            SQL
            echo "RESULT_ROLE_READY=yes"

            # --- 3. Prove bld_app can do its job and nothing more (before switching) ---
            APP_URL=$(printf '%s' "$OWNER_URL" | sed -E "s|^(postgres(ql)?://)[^@]*@|\1bld_app:${PW}@|")
            CHECK=$(PW= psql_as "$APP_URL" <<'SQL'
            SELECT 'missing_dml=' || count(*) FROM pg_tables t
              WHERE t.schemaname = 'public'
                AND t.tablename NOT IN ('_prisma_migrations', 'spatial_ref_sys')
                AND NOT has_table_privilege(current_user, format('%I.%I', t.schemaname, t.tablename), 'SELECT,INSERT,UPDATE,DELETE');
            SELECT 'can_create=' || has_schema_privilege(current_user, 'public', 'CREATE')::text;
            SELECT 'can_read_migrations=' || COALESCE(has_table_privilege(current_user, 'public._prisma_migrations', 'SELECT'), false)::text;
            SELECT 'tls=' || COALESCE((SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()), false)::text;
            SELECT 'superuser=' || rolsuper::text FROM pg_roles WHERE rolname = current_user;
            SQL
            ) || abort_after_rotation app_login_failed
            printf '%s\n' "$CHECK" | sed 's/^/RESULT_APP_/'
            printf '%s\n' "$CHECK" | grep -qx 'missing_dml=0' || abort_after_rotation app_missing_grants
            printf '%s\n' "$CHECK" | grep -qx 'tls=true' || abort_after_rotation app_no_tls

            # --- 4. Switch the API to bld_app; fall back to owner if it is not healthy ---
            setenv DIRECT_DATABASE_URL "$OWNER_URL"
            setenv DATABASE_URL "$APP_URL"
            setenv DB_APP_ROLE bld_app
            unset PW APP_URL
            docker compose up -d --force-recreate api >/dev/null
            if ! wait_api; then
              fall_back_to_owner
              echo "RESULT_STAGE=api_unhealthy_fell_back_to_owner"; exit 1
            fi
            sleep 5
            if docker logs bld-api --since 3m 2>&1 | grep -qi 'permission denied'; then
              fall_back_to_owner
              echo "RESULT_STAGE=permission_denied_fell_back_to_owner"; exit 1
            fi
            if ! curl -sf --max-time 10 http://127.0.0.1:4000/health | grep -q '"database":{"status":"up"}'; then
              fall_back_to_owner
              echo "RESULT_STAGE=db_health_down_fell_back_to_owner"; exit 1
            fi
            docker rmi "$PG_IMG" >/dev/null 2>&1 || true
            echo "RESULT_STAGE=done"

      - name: Summarize
        if: always()
        env:
          REMOTE: ${{ steps.remote.outputs.stdout }}
        run: |
          RESULTS=$(printf '%s\n' "$REMOTE" | grep -E '^RESULT_' | tr -d '\r' || true)
          {
            echo "### Staging DB app role"
            echo '```'
            printf '%s\n' "$RESULTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=DB app role::$(printf '%s ' $RESULTS)"
          printf '%s\n' "$RESULTS" | grep -qx 'RESULT_STAGE=done'
