name: Debug Staging Signup Login

on:
  workflow_dispatch:
    inputs:
      email:
        default: noreply@bld.online
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BLD/stage
            eval "$(grep -E '^AUTH0_[A-Z0-9_]+=' .env | tr -d '\r' | sed 's/\r$//')"
            EMAIL='${{ inputs.email }}'
            echo "domain=$AUTH0_DOMAIN"
            echo "audience=$AUTH0_AUDIENCE"
            echo "conn=${AUTH0_DB_CONNECTION:-UNSET}"
            echo "client=${AUTH0_CLIENT_ID:0:8}..."
            TOKEN=$(curl -sS -X POST "https://${AUTH0_DOMAIN}/oauth/token" \
              -H 'content-type: application/json' \
              -d "{\"client_id\":\"${AUTH0_MGMT_CLIENT_ID}\",\"client_secret\":\"${AUTH0_MGMT_CLIENT_SECRET}\",\"audience\":\"https://${AUTH0_DOMAIN}/api/v2/\",\"grant_type\":\"client_credentials\"}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$EMAIL")
            USERS=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://${AUTH0_DOMAIN}/api/v2/users-by-email?email=${ENC}")
            echo "$USERS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("users",len(d));
            [print(u.get("user_id"), "verified=",u.get("email_verified"), "blocked=",u.get("blocked"), "idents=",[(i.get("connection"), i.get("provider")) for i in u.get("identities",[])]) for u in d]'
            APP=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_CLIENT_ID}?fields=name,grant_types,app_type,is_first_party&include_fields=true")
            echo "$APP" | python3 -c 'import sys,json; a=json.load(sys.stdin); print("app", a.get("name"), a.get("app_type")); print("grants", a.get("grant_types"))'
            # Probe password-realm grant with a deliberately wrong password to see error shape (no secret leak)
            PROBE=$(curl -sS -X POST "https://${AUTH0_DOMAIN}/oauth/token" \
              -H 'content-type: application/json' \
              -d "{\"grant_type\":\"http://auth0.com/oauth/grant-type/password-realm\",\"username\":\"${EMAIL}\",\"password\":\"definitely-wrong-password-xxx\",\"audience\":\"${AUTH0_AUDIENCE}\",\"client_id\":\"${AUTH0_CLIENT_ID}\",\"client_secret\":\"${AUTH0_CLIENT_SECRET}\",\"realm\":\"${AUTH0_DB_CONNECTION:-Username-Password-Authentication}\",\"scope\":\"openid profile email\"}" || true)
            echo "probe_wrong_pw=$(echo "$PROBE" | python3 -c 'import sys,json
            try:
              d=json.load(sys.stdin); print(d.get("error"), d.get("error_description","")[:180])
            except Exception as e:
              print("parse_fail", e)')"
            echo '=== recent signup login failures ==='
            docker logs bld-api --tail 150 2>&1 | grep -Ei 'Signup created|Auth0 login failed|password login|noreply@bld|Invalid email' || true
            echo '=== DB row ==='
            docker exec bld-db psql -U surveylink -d surveylink -c "SELECT email, phone, auth_provider, left(auth_subject,40) AS sub, onboarding_step FROM users WHERE email ILIKE '${EMAIL}';"
