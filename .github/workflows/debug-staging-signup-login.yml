name: Debug Staging Signup Login
on:
  workflow_dispatch:
    inputs:
      email:
        default: noreply@bld.online
        required: true
jobs:
  debug:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BLD/stage
            eval "$(grep -E '^(AUTH0_DOMAIN|AUTH0_AUDIENCE|AUTH0_CLIENT_ID|AUTH0_CLIENT_SECRET|AUTH0_DB_CONNECTION|AUTH0_MGMT_CLIENT_ID|AUTH0_MGMT_CLIENT_SECRET)=' .env | tr -d '\r')"
            EMAIL='${{ inputs.email }}'
            echo "domain=$AUTH0_DOMAIN audience=$AUTH0_AUDIENCE conn=$AUTH0_DB_CONNECTION client=${AUTH0_CLIENT_ID:0:8}..."
            TOKEN=$(curl -sS -X POST "https://${AUTH0_DOMAIN}/oauth/token" -H 'content-type: application/json' -d "{\"client_id\":\"${AUTH0_MGMT_CLIENT_ID}\",\"client_secret\":\"${AUTH0_MGMT_CLIENT_SECRET}\",\"audience\":\"https://${AUTH0_DOMAIN}/api/v2/\",\"grant_type\":\"client_credentials\"}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$EMAIL")
            USERS=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://${AUTH0_DOMAIN}/api/v2/users-by-email?email=${ENC}")
            echo "$USERS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("users",len(d));
            [print(u.get("user_id"), "verified=",u.get("email_verified"), "blocked=",u.get("blocked"), "idents=",[(i.get("connection"), i.get("provider"), i.get("isSocial")) for i in u.get("identities",[])]) for u in d]'
            # App grants
            APP=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_CLIENT_ID}?fields=name,grant_types,app_type,is_first_party&include_fields=true")
            echo "$APP" | python3 -c 'import sys,json; a=json.load(sys.stdin); print("app", a.get("name"), a.get("app_type")); print("grants", a.get("grant_types"))'
            echo '=== recent signup login failures ==='
            docker logs bld-api --tail 120 2>&1 | grep -Ei 'Signup created|Auth0 login failed|password login|noreply@bld' || true
            echo '=== DB row ==='
            docker exec bld-db psql -U surveylink -d surveylink -c "SELECT email, phone, auth_provider, left(auth_subject,40) sub, onboarding_step FROM users WHERE email ILIKE 'noreply@bld.online';"
