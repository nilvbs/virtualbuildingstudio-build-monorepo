name: Fix Auth0 Password Grant

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Enable password-realm on Auth0 app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BLD/stage
            eval "$(grep -E '^AUTH0_[A-Z0-9_]+=' .env | tr -d '\r')"
            export AUTH0_DOMAIN AUTH0_CLIENT_ID AUTH0_CLIENT_SECRET AUTH0_AUDIENCE
            export AUTH0_MGMT_CLIENT_ID AUTH0_MGMT_CLIENT_SECRET
            export AUTH0_DB_CONNECTION="${AUTH0_DB_CONNECTION:-Username-Password-Authentication}"

            python3 <<'PY'
            import json, os, urllib.request, urllib.error, subprocess, time

            domain = os.environ["AUTH0_DOMAIN"]
            audience = os.environ["AUTH0_AUDIENCE"]
            client_id = os.environ["AUTH0_CLIENT_ID"]
            client_secret = os.environ["AUTH0_CLIENT_SECRET"]
            mgmt_id = os.environ["AUTH0_MGMT_CLIENT_ID"]
            mgmt_secret = os.environ["AUTH0_MGMT_CLIENT_SECRET"]
            realm = os.environ.get("AUTH0_DB_CONNECTION") or "Username-Password-Authentication"

            def post_json(url, payload, headers=None):
                data = json.dumps(payload).encode()
                req = urllib.request.Request(url, data=data, headers={**(headers or {}), "content-type": "application/json"})
                try:
                    with urllib.request.urlopen(req) as r:
                        return json.load(r)
                except urllib.error.HTTPError as e:
                    body = e.read().decode("utf-8", "replace")
                    try:
                        return json.loads(body)
                    except Exception:
                        return {"statusCode": e.code, "message": body[:300]}

            def get_json(url, token):
                req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                with urllib.request.urlopen(req) as r:
                    return json.load(r)

            def patch_json(url, payload, token):
                data = json.dumps(payload).encode()
                req = urllib.request.Request(
                    url,
                    data=data,
                    method="PATCH",
                    headers={"Authorization": f"Bearer {token}", "content-type": "application/json"},
                )
                try:
                    with urllib.request.urlopen(req) as r:
                        return json.load(r)
                except urllib.error.HTTPError as e:
                    body = e.read().decode("utf-8", "replace")
                    try:
                        return json.loads(body)
                    except Exception:
                        return {"statusCode": e.code, "message": body[:300]}

            tok = post_json(
                f"https://{domain}/oauth/token",
                {
                    "client_id": mgmt_id,
                    "client_secret": mgmt_secret,
                    "audience": f"https://{domain}/api/v2/",
                    "grant_type": "client_credentials",
                },
            )
            token = tok["access_token"]
            app = get_json(f"https://{domain}/api/v2/clients/{client_id}", token)
            print("name=", app.get("name"))
            print("app_type=", app.get("app_type"))
            before = list(app.get("grant_types") or [])
            print("BEFORE", before)
            needed = [
                "authorization_code",
                "implicit",
                "refresh_token",
                "client_credentials",
                "password",
                "http://auth0.com/oauth/grant-type/password-realm",
            ]
            after = list(dict.fromkeys(before + needed))
            print("AFTER", after)
            patched = patch_json(
                f"https://{domain}/api/v2/clients/{client_id}",
                {"grant_types": after},
                token,
            )
            print("patched_grants=", patched.get("grant_types"))
            print("patch_msg=", (patched.get("message") or "ok")[:200])

            probe = post_json(
                f"https://{domain}/oauth/token",
                {
                    "grant_type": "http://auth0.com/oauth/grant-type/password-realm",
                    "username": "noreply@bld.online",
                    "password": "definitely-wrong-password-xxx",
                    "audience": audience,
                    "client_id": client_id,
                    "client_secret": client_secret,
                    "realm": realm,
                    "scope": "openid profile email",
                },
            )
            print("probe=", probe.get("error"), (probe.get("error_description") or "")[:220])
            PY

            if ! grep -q '^AUTH0_DB_CONNECTION=' .env; then
              printf '\nAUTH0_DB_CONNECTION=Username-Password-Authentication\n' >> .env
              echo Added AUTH0_DB_CONNECTION
            else
              sed -i 's/\r$//' .env
              sed -i 's/^AUTH0_DB_CONNECTION=$/AUTH0_DB_CONNECTION=Username-Password-Authentication/' .env
            fi
            grep '^AUTH0_DB_CONNECTION=' .env | tr -d '\r'
            docker compose up -d --force-recreate api
            sleep 10
            curl -sS http://127.0.0.1:4000/health
            echo
