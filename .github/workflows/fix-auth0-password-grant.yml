name: Fix Auth0 Password Grant

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Enable password-realm on Auth0 app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BLD/stage
            eval "$(grep -E '^AUTH0_[A-Z0-9_]+=' .env | tr -d '\r')"
            export AUTH0_DOMAIN AUTH0_CLIENT_ID AUTH0_CLIENT_SECRET AUTH0_AUDIENCE AUTH0_MGMT_CLIENT_ID AUTH0_MGMT_CLIENT_SECRET
            export AUTH0_DB_CONNECTION="${AUTH0_DB_CONNECTION:-Username-Password-Authentication}"

            TOKEN=$(curl -sS -X POST "https://${AUTH0_DOMAIN}/oauth/token" \
              -H 'content-type: application/json' \
              -d "{\"client_id\":\"${AUTH0_MGMT_CLIENT_ID}\",\"client_secret\":\"${AUTH0_MGMT_CLIENT_SECRET}\",\"audience\":\"https://${AUTH0_DOMAIN}/api/v2/\",\"grant_type\":\"client_credentials\"}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
            export TOKEN

            echo '=== current client ==='
            curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_CLIENT_ID}" \
              | python3 -c 'import sys,json; a=json.load(sys.stdin); print("name=",a.get("name")); print("app_type=",a.get("app_type")); print("grants=",a.get("grant_types")); print("err=",a.get("message","")[:200] if a.get("message") else "")"

            python3 <<'PY' > /tmp/auth0-client-patch.json
            import json, os, urllib.request, sys
            domain = os.environ["AUTH0_DOMAIN"]
            token = os.environ["TOKEN"]
            client_id = os.environ["AUTH0_CLIENT_ID"]
            req = urllib.request.Request(
                f"https://{domain}/api/v2/clients/{client_id}",
                headers={"Authorization": f"Bearer {token}"},
            )
            with urllib.request.urlopen(req) as r:
                app = json.load(r)
            needed = [
                "authorization_code",
                "implicit",
                "refresh_token",
                "client_credentials",
                "password",
                "http://auth0.com/oauth/grant-type/password-realm",
            ]
            current = list(app.get("grant_types") or [])
            merged = list(dict.fromkeys(current + needed))
            sys.stderr.write(f"BEFORE {current}\nAFTER {merged}\n")
            print(json.dumps({"grant_types": merged}))
            PY

            echo '=== patching grant_types ==='
            curl -sS -X PATCH "https://${AUTH0_DOMAIN}/api/v2/clients/${AUTH0_CLIENT_ID}" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'content-type: application/json' \
              -d @/tmp/auth0-client-patch.json \
              | python3 -c 'import sys,json; a=json.load(sys.stdin); print("name=",a.get("name")); print("grants=",a.get("grant_types")); print("msg=", (a.get("message") or "ok")[:200])'

            echo '=== probe password-realm (wrong pw) ==='
            PROBE=$(curl -sS -X POST "https://${AUTH0_DOMAIN}/oauth/token" \
              -H 'content-type: application/json' \
              -d "{\"grant_type\":\"http://auth0.com/oauth/grant-type/password-realm\",\"username\":\"noreply@bld.online\",\"password\":\"definitely-wrong-password-xxx\",\"audience\":\"${AUTH0_AUDIENCE}\",\"client_id\":\"${AUTH0_CLIENT_ID}\",\"client_secret\":\"${AUTH0_CLIENT_SECRET}\",\"realm\":\"${AUTH0_DB_CONNECTION}\",\"scope\":\"openid profile email\"}")
            echo "$PROBE" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("error"), (d.get("error_description") or "")[:220])'

            if ! grep -q '^AUTH0_DB_CONNECTION=' .env; then
              printf '\nAUTH0_DB_CONNECTION=Username-Password-Authentication\n' >> .env
              echo 'Added AUTH0_DB_CONNECTION'
            else
              sed -i 's/\r$//' .env
              sed -i 's/^AUTH0_DB_CONNECTION=\s*$/AUTH0_DB_CONNECTION=Username-Password-Authentication/' .env
            fi
            grep '^AUTH0_DB_CONNECTION=' .env | tr -d '\r'
            docker compose up -d --force-recreate api
            sleep 10
            curl -sS http://127.0.0.1:4000/health
            echo
